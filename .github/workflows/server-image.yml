# The server image, ghcr.io/<owner>/post-server, for deploy/server.sh, so a
# small server downloads it instead of compiling (deploy/README.md). Made for
# server releases only, which is what servers run:
#
#   scripts/release.sh new server 1.2.0   tags server-v1.2.0 and pushes it;
#                                         this builds :1.2.0 and :latest
#
# The server and the app are versioned apart (app releases: release.yml);
# they agree through the protocol, not their version numbers.
#
# Built with Podman, so .containerignore applies as it does on a server.
name: Server image

on:
  push:
    tags: ['server-v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build and publish
        env:
          TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/post-server
          version=${GITHUB_REF_NAME#server-v}
          tags=(-t "$image:$version" -t "$image:latest")
          echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman build -f deploy/Containerfile \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            "${tags[@]}" .
          for t in "${tags[@]}"; do
            [[ $t == -t ]] || podman push "$t"
          done
