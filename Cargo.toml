[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
# Edition 2024 let-chains need 1.88.
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Crypto versions match what OpenMLS 0.9 already depends on, so the client links
# one copy of each.
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
ml-dsa = "0.1.2"
sha2 = "0.10"
# Sealing device-link slots, and ephemeral signals from phase 4 (design
# sections 5 and 6). The 0.10/0.12 lines share digest 0.10 with sha2.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = "1.8"
prost = "0.14"
thiserror = "2"
hex = "0.4"
proptest = "1.12"

# MLS. Pinned exactly: the hybrid suite uses a provisional codepoint, and an
# upgrade must be a deliberate step (design section 6).
openmls = { version = "=0.9.2", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_sqlite_storage = { version = "=0.3.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
# Must match the version openmls_sqlite_storage uses, so they share one
# Connection type. SQLCipher for client databases; harmless for the server.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher", "functions"] }

# Runtime, networking, interfaces.
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "signal"] }
axum = { version = "0.8", features = ["ws"] }
# wss:// with the operating system's trust store.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# The TLS crypto backend for tokio-tungstenite: aws-lc-rs, with the hybrid
# X25519MLKEM768 group tried first (design section 8, Transport).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
url = "2.5"
tempfile = "3"
# The Flutter app's bridge (crates/post-ffi). Pinned exactly: it must equal
# the flutter_rust_bridge_codegen version that generated the bindings, and the
# Dart package version in app/pubspec.yaml.
flutter_rust_bridge = "=2.13.0"
# The app's database key lives in the platform keystore (design section 11).
# Linux: the Secret Service (GNOME Keyring, KWallet), over encrypted D-Bus.
keyring-core = "1.0"
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }
# Spellchecking in the app: Hunspell dictionaries read in pure Rust, many of
# them in legacy encodings that are converted to UTF-8 first.
spellbook = "0.4"
encoding_rs = "0.8"
base64 = "0.22"
# The offline release key's file, sealed with a passphrase (design section
# 12, "App updates"): Argon2id stretches the passphrase.
argon2 = "0.5"
rpassword = "7.5"
# Anonymous tokens, RFC 9474. Uses rsa 0.10, which fixed the Marvin timing
# side channel (RUSTSEC-2023-0071) by moving to constant-time arithmetic.
blind-rsa-signatures = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
