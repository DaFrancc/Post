[package]
name = "postern-server"
description = "posternd: the Postern relay and storage server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "posternd"
path = "src/main.rs"

[features]
# Build OpenSSL (for SQLCipher) into the binary, for minimal container images
# with no system libcrypto. Needs a full Perl at build time.
vendored-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
postern-identity = { path = "../postern-identity" }
postern-mls = { path = "../postern-mls" }
postern-proto = { path = "../postern-proto" }
rusqlite.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
prost.workspace = true
getrandom.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
blind-rsa-signatures.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
