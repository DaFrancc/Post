[package]
# An underscore, unlike the other crates: cargokit (the Flutter build glue in
# app/rust_builder) names the built library after the package.
name = "postern_ffi"
description = "The bridge between the Flutter app and postern-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib/staticlib for the app; rlib so tests can link it.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
postern-core = { path = "../postern-core" }
flutter_rust_bridge.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true
keyring-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Not the workspace lints: those forbid unsafe code outright, and the
# generated FFI glue (src/frb_generated.rs) needs it. Here unsafe is denied,
# and allowed only on that one generated module.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
unwrap_used = "warn"
